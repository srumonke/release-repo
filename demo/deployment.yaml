apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
    environment: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        environment: demo
    spec:
      containers:
      - name: demo-app
        # Public sample image so the demo is self-contained (no private registry/pull secret needed).
        # A real CI pipeline replaces this tag with the freshly built demo-app image.
        image: kennethreitz/httpbin:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        # httpbin serves on 80; map the probe there. Swap path to /health for the real demo-app image.
        livenessProbe:
          httpGet:
            path: /status/200
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /status/200
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        env:
        - name: GUNICORN_CMD_ARGS
          value: "--bind=0.0.0.0:8080"
