# Production Environment Configuration
environment: prod
namespace: prod

image:
  repository: demo-app
  tag: latest
  pullPolicy: IfNotPresent

replicas: 3

strategy:
  type: RollingUpdate
  maxSurge: 1
  maxUnavailable: 0

resources:
  requests:
    memory: "1Gi"
    cpu: "1000m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

healthCheck:
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

springProfile: prod

jvm:
  opts: "-Xms512m -Xmx1536m"
