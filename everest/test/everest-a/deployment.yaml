# Everest hotfix demo manifest.
# Patched by GitOpsUpdateReleaseRepo at key spec.template.spec.containers[0].image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: everest-a
  namespace: test
  labels:
    app: everest-a
    environment: test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: everest-a
  template:
    metadata:
      labels:
        app: everest-a
        environment: test
    spec:
      containers:
      - name: everest-a
        image: pkg.harness.io/am8hcbditxgqnrtihnl7qq/sruthi-docker/everest-a:4.1.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        # Spring Boot needs ~40s to come up under these CPU limits. The startupProbe owns
        # the boot window (36 x 5s = 3 min); liveness only takes over once it passes, so a
        # slow start can never be mistaken for a hung container.
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "test"
        - name: SERVER_PORT
          value: "8080"
