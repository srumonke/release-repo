# Staging Environment Configuration
environment: staging
namespace: staging

image:
  repository: demo-app
  tag: latest
  pullPolicy: Always

replicas: 2

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

healthCheck:
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

springProfile: staging
